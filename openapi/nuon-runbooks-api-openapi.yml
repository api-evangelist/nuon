swagger: '2.0'
info:
  contact:
    email: support@nuon.co
    name: Nuon Support
  description: API for managing nuon apps, components, installs, and actions.
  title: Nuon accounts runbooks API
  version: 0.19.1074
host: api.nuon.co
basePath: /
schemes:
- https
tags:
- description: runbooks
  name: runbooks
