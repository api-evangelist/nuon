      tags:
      - vcs
  /v1/vcs/{vcs_connection_id}/events:
    post:
      description: Writes incoming webhook events for a VCS connection (legacy endpoint)
      operationId: WriteVCSEvent
      parameters:
      - description: VCS Connection ID
        in: path
        name: vcs_connection_id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
