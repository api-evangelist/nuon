components:
  schemas:
    github.Match:
      properties:
        indices:
          items:
            type: integer
          type: array
        text:
          type: string
      type: object
    service.VCSConnectionRepo:
      properties:
        default_branch:
          type: string
        description:
          type: string
        fork:
          type: boolean
        full_name:
          type: string
        html_url:
          type: string
        id:
          type: integer
        name:
          type: string
        private:
          type: boolean
        updated_at:
          type: string
      type: object
    service.VCSConnectionStatusResponse:
      properties:
        account:
          $ref: '#/components/schemas/service.VCSConnectionAccount'
        checked_at:
          type: string
        error:
          type: string
        github_install_id:
          type: string
        permissions:
          additionalProperties:
            type: string
          type: object
        repository_selection:
          type: string
        status:
          type: string
        suspended_at:
          type: string
        suspended_by:
          $ref: '#/components/schemas/github.User'
      type: object
    service.CreateConnectionCallbackRequest:
      properties:
        github_install_id:
          type: string
        org_id:
          type: string
      required:
      - github_install_id
      - org_id
      type: object
    github.User:
      properties:
        avatar_url:
          type: string
        bio:
          type: string
        blog:
          type: string
        collaborators:
          type: integer
        company:
          type: string
        created_at:
          $ref: '#/components/schemas/github.Timestamp'
        disk_usage:
          type: integer
        email:
          type: string
        events_url:
          type: string
        followers:
          type: integer
        followers_url:
          type: string
        following:
          type: integer
        following_url:
          type: string
        gists_url:
          type: string
        gravatar_id:
          type: string
        hireable:
          type: boolean
        html_url:
          type: string
        id:
          type: integer
        ldap_dn:
          type: string
        location:
          type: string
        login:
          type: string
        name:
          type: string
        node_id:
          type: string
        organizations_url:
          type: string
        owned_private_repos:
          type: integer
        permissions:
          additionalProperties:
            type: boolean
          description: 'Permissions and RoleName identify the permissions and role that a user has on a given

            repository. These are only populated when calling Repositories.ListCollaborators.'
          type: object
        plan:
          $ref: '#/components/schemas/github.Plan'
        private_gists:
          type: integer
        public_gists:
          type: integer
        public_repos:
          type: integer
        received_events_url:
          type: string
        repos_url:
          type: string
        role_name:
          type: string
        site_admin:
          type: boolean
        starred_url:
          type: string
        subscriptions_url:
          type: string
        suspended_at:
          $ref: '#/components/schemas/github.Timestamp'
        text_matches:
          description: 'TextMatches is only populated from search results that request text matches

            See: search.go and https://docs.github.com/en/rest/search/#text-match-metadata'
          items:
            $ref: '#/components/schemas/github.TextMatch'
          type: array
        total_private_repos:
          type: integer
        twitter_username:
          type: string
        two_factor_authentication:
          type: boolean
        type:
          type: string
        updated_at:
          $ref: '#/components/schemas/github.Timestamp'
        url:
          description: API URLs
          type: string
      type: object
    app.GithubEvent:
      properties:
        created_at:
          type: string
        created_by_id:
          type: string
        event_type:
          type: string
        github_install_id:
          type: string
        id:
          type: string
        payload:
          $ref: '#/components/schemas/blobstore.Blob'
        status:
          $ref: '#/components/schemas/app.CompositeStatus'
        updated_at:
          type: string
      type: object
    app.VCSConnectionCommit:
      properties:
        author_email:
          type: string
        author_name:
          type: string
        created_at:
          type: string
        created_by_id:
          type: string
        id:
          type: string
        message:
          type: string
        owner_id:
          description: Polymorphic ownership - references VCS config that owns this commit
          type: string
        owner_type:
          type: string
        sha:
          type: string
        updated_at:
          type: string
        vcs_connection_id:
          type: string
      type: object
    github.Plan:
      properties:
        collaborators:
          type: integer
        filled_seats:
          type: integer
        name:
          type: string
        private_repos:
          type: integer
        seats:
          type: integer
        space:
          type: integer
      type: object
    service.Branch:
      properties:
        name:
          type: string
      type: object
    app.Queue:
      properties:
        created_at:
          type: string
        created_by_id:
          type: string
        emitters:
          items:
            $ref: '#/components/schemas/app.QueueEmitter'
          type: array
        id:
          type: string
        idle_timeout:
          type: integer
        max_depth:
          type: integer
        max_in_flight:
          type: integer
        metadata:
          additionalProperties:
            type: string
          type: object
        name:
          type: string
        org_id:
          type: string
        owner_id:
          type: string
        owner_type:
          type: string
        queue_signal:
          items:
            $ref: '#/components/schemas/app.QueueSignal'
          type: array
        status_v2:
          $ref: '#/components/schemas/app.CompositeStatus'
        updated_at:
          type: string
        workflow:
          $ref: '#/components/schemas/signaldb.WorkflowRef'
      type: object
    app.QueueEmitter:
      properties:
        created_at:
          type: string
        created_by_id:
          type: string
        cron_schedule:
          description: 'Schedule configuration

            For cron mode: cron expression (e.g., "0 * * * *")'
          type: string
        description:
          type: string
        emit_count:
          type: integer
        fired:
          description: 'For scheduled mode: whether the signal has been fired'
          type: boolean
        id:
          type: string
        jitter_window:
          description: 'For cron mode: spread emitter ticks deterministically across this window

            to avoid thundering-herd when many emitters share a schedule. A hash of the

            emitter ID determines each emitter''s static offset within the window. Zero

            disables jitter (default).'
          type: integer
        last_emitted_at:
          type: string
        mode:
          allOf:
          - $ref: '#/components/schemas/app.QueueEmitterMode'
          description: 'Emitter mode: "cron" for recurring, "scheduled" for one-shot'
        name:
          description: Emitter identity
          type: string
        next_emit_at:
          type: string
        org_id:
          type: string
        queue_id:
          description: 'Many-to-one: each emitter belongs to exactly one queue'
          type: string
        scheduled_at:
          description: 'For scheduled mode: the time to fire the signal'
          type: string
        signal_expires_in:
          description: 'Optional TTL for emitted signals. When set, each emitted signal''s ExpiresAt

            is computed as time.Now().Add(SignalExpiresIn) at emission time.'
          type: integer
        signal_template:
          $ref: '#/components/schemas/signaldb.SignalData'
        signal_type:
          description: Signal template - the signal to emit on each tick
          type: string
        status:
          allOf:
          - $ref: '#/components/schemas/app.CompositeStatus'
          description: Runtime state using shared CompositeStatus
        updated_at:
          type: string
        workflow:
          allOf:
          - $ref: '#/components/schemas/signaldb.WorkflowRef'
          description: Workflow reference for the emitter's cron workflow
      type: object
    cctx.SignalContext:
      properties:
        account_id:
