openapi: 3.2.0
info:
  contact:
    email: support@nuon.co
    name: Nuon Support
  description: API for managing nuon apps, components, installs, and actions.
  title: Nuon Installs API
  version: 0.19.1074
servers:
- url: https://api.nuon.co/
tags:
- description: installs
  name: installs
