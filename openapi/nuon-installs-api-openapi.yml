  /v1/apps/{app_id}/installs:
    get:
      description: Returns all installs for the provided app.
      operationId: GetAppInstalls
      parameters:
      - description: app ID
        in: path
        name: app_id
        required: true
        schema:
          type: string
      - description: search query to filter installs by name or ID
        in: query
        name: q
        schema:
          type: string
      - description: label filter (key:value,key:value)
        in: query
        name: labels
        schema:
          type: string
      - description: offset of results to return
        in: query
        name: offset
        schema:
          type: integer
          default: 0
      - description: limit of results to return
        in: query
        name: limit
        schema:
          type: integer
          default: 10
      - description: page number of results to return
        in: query
        name: page
        schema:
          type: integer
          default: 0
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/app.Install'
                type: array
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/stderr.ErrResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/stderr.ErrResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/stderr.ErrResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/stderr.ErrResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/stderr.ErrResponse'
      security:
      - APIKey: []
      - OrgID: []
      summary: get all installs for an app
      tags:
      - installs
    post:
      deprecated: true
      description: Create a new install for an app.
      operationId: CreateInstall
      parameters:
      - description: app ID
        in: path
        name: app_id
        required: true
        schema:
          type: string
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
