    type: string
    x-enum-varnames:
    - AppConfigStatusActive
    - AppConfigStatusPending
    - AppConfigStatusSyncing
    - AppConfigStatusError
    - AppConfigStatusOutdated
  configs.OCIRegistryType:
    enum:
    - ecr
    - acr
    - gar
    - private_oci
    - public_oci
    type: string
    x-enum-varnames:
    - OCIRegistryTypeECR
    - OCIRegistryTypeACR
    - OCIRegistryTypeGAR
    - OCIRegistryTypePrivateOCI
    - OCIRegistryTypePublicOCI
  plantypes.OCIArtifactReference:
    properties:
      digest:
        description: Digest is the immutable artifact digest (e.g., sha256:abc123...)
        type: string
      tag:
        description: Tag is the artifact tag (typically the build ID)
        type: string
      url:
        description: URL is the full artifact URL (e.g., registry.nuon.co/org_id/app_id)
        type: string
    type: object
