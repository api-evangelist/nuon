swagger: '2.0'
info:
  contact:
    email: support@nuon.co
    name: Nuon Support
  description: API for managing nuon apps, components, installs, and actions.
  title: Nuon accounts apps API
  version: 0.19.1074
host: api.nuon.co
basePath: /
schemes:
- https
tags:
- description: apps
  name: apps
paths:
  /v1/apps:
    get:
      consumes:
      - application/json
      description: 'Returns all apps for the authenticated user.

        '
      operationId: GetApps
      parameters:
      - default: 0
        description: offset of jobs to return
        in: query
        name: offset
        type: integer
      - description: search query to filter apps by name or ID
        in: query
        name: q
        type: string
      - default: 10
        description: limit of jobs to return
        in: query
        name: limit
        type: integer
      - default: 0
        description: page number of results to return
        in: query
        name: page
        type: integer
      produces:
      - application/json
      responses:
        '200':
          description: OK
          schema:
            items:
              $ref: '#/definitions/app.App'
            type: array
        '400':
          description: Bad Request
          schema:
            $ref: '#/definitions/stderr.ErrResponse'
        '401':
          description: Unauthorized
          schema:
            $ref: '#/definitions/stderr.ErrResponse'
        '403':
          description: Forbidden
          schema:
            $ref: '#/definitions/stderr.ErrResponse'
        '404':
          description: Not Found
          schema:
            $ref: '#/definitions/stderr.ErrResponse'
        '500':
          description: Internal Server Error
          schema:
            $ref: '#/definitions/stderr.ErrResponse'
      security:
      - APIKey: []
      - OrgID: []
      summary: get all apps for the current org
      tags:
      - apps
    post:
      consumes:
      - application/json
      description: 'Create a new app.

        '
      operationId: CreateApp
      parameters:
      - description: Input
        in: body
        name: req
        required: true
        schema:
          $ref: '#/definitions/service.CreateAppRequest'
      produces:
      - application/json
      responses:
        '201':
          description: Created
          schema:
            $ref: '#/definitions/app.App'
        '400':
          description: Bad Request
          schema:
            $ref: '#/definitions/stderr.ErrResponse'
        '401':
          description: Unauthorized
          schema:
            $ref: '#/definitions/stderr.ErrResponse'
        '403':
          description: Forbidden
          schema:
            $ref: '#/definitions/stderr.ErrResponse'
        '404':
          description: Not Found
          schema:
            $ref: '#/definitions/stderr.ErrResponse'
        '409':
          description: Conflict
          schema:
            $ref: '#/definitions/stderr.ErrResponse'
        '500':
          description: Internal Server Error
          schema:
            $ref: '#/definitions/stderr.ErrResponse'
      security:
      - APIKey: []
      - OrgID: []
      summary: create an app
      tags:
      - apps
  /v1/apps/{app_id}:
    delete:
      consumes:
      - application/json
      description: 'Delete an app.

        '
      operationId: DeleteApp
      parameters:
      - description: app ID
        in: path
        name: app_id
        required: true
        type: string
      produces:
