  pass: local-v1
description: >-
  Nuon is a Bring Your Own Cloud (BYOC) continuous-delivery platform for software vendors. It lets
  vendors package existing applications — Terraform, Pulumi, Helm charts, Kubernetes manifests, and
  container images — and deploy them into their customers' own AWS, Azure, or GCP accounts while
  keeping a SaaS-like experience. Nuon runs a Control Plane plus egress-only Runners installed in
  each customer account (no cross-account IAM), and adds day-2 operations: least-privilege operation
  roles, drift detection, approval workflows, OPA-based policies, runbooks, secrets, actions, and
  org-scoped CloudEvents webhooks. The platform exposes a REST control-plane API (OpenAPI v2 + v3),
  a first-party CLI and TUIs, Go/Python/Elixir SDKs, and Terraform providers. Nuon's core is open
  source under github.com/nuonco.
